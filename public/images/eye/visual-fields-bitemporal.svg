<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-label="Visual field charts of both eyes">
<title>Visual fields as seen by the patient: loss of the temporal half of the field in each eye</title>
<rect width="100%" height="100%" fill="#fff"/>
<clipPath id="clip-left"><circle cx="130" cy="140" r="100"/></clipPath>
<rect x="30" y="40" width="100" height="200" fill="#444" clip-path="url(#clip-left)"/>
<circle cx="130" cy="140" r="100" fill="none" stroke="#222" stroke-width="2"/>
<line x1="130" y1="36" x2="130" y2="244" stroke="#888" stroke-dasharray="4 4"/>
<line x1="26" y1="140" x2="234" y2="140" stroke="#888" stroke-dasharray="4 4"/>
<text x="130" y="268" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#222">Left eye</text>
<clipPath id="clip-right"><circle cx="390" cy="140" r="100"/></clipPath>
<rect x="390" y="40" width="100" height="200" fill="#444" clip-path="url(#clip-right)"/>
<circle cx="390" cy="140" r="100" fill="none" stroke="#222" stroke-width="2"/>
<line x1="390" y1="36" x2="390" y2="244" stroke="#888" stroke-dasharray="4 4"/>
<line x1="286" y1="140" x2="494" y2="140" stroke="#888" stroke-dasharray="4 4"/>
<text x="390" y="268" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#222">Right eye</text>
<text x="260.0" y="20" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#333">Fields plotted as seen by the patient · shaded = field loss</text>
</svg>